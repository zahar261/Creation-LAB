const methOf=(r,l)=>{const m=(r&&r.meth)||{},ok=a=>a&&a.length;if(m.ed&&m.ed!==l&&ok(m[m.ed]))return m[m.ed];return ok(m[l])?m[l]:ok(m.en)?m.en:ok(m.ar)?m.ar:[]};
const DATA={"CATS":[{"id":"all","label":"الكل","en":"All"},{"id":"emul","label":"الاستحلاب","en":"Emulsification"},{"id":"air","label":"التهوية","en":"Aeration"},{"id":"thick","label":"التكثيف","en":"Thickening"},{"id":"texture","label":"القوام والحفظ","en":"Texture and keeping"}],"PROBLEMS":[{"id":"stale","cat":"texture","title":"الكيكة تيبس بعد يوم أو يومين","cause":"النشا المتجلتن يتصلب مع الوقت (retrogradation) ويطرد الماء المحبوس، فتجف الكيكة وتصير بايتة.","fix":["استبدل جزءاً من السكر بسكر مقلوب أو عسل: الفركتوز فيهما أكثر السكريات امتصاصاً للماء.","أضف ألياف الحمضيات (citrus fiber): تحبس ماءً يصل إلى 10 أضعاف وزنها، وتبقي المخبوزات رطبة مدة أطول.","تجنّب دورات التجميد والإذابة المتكررة لأنها تسرّع تصلب النشا."],"note":"الكميات التي يقترحها الحاسبة نقاط انطلاق للتجربة، وليست أرقاماً من الدورة.","calc":true,"en":{"title":"Cake goes stale after a day or two","cause":"Gelatinized starch hardens over time (retrogradation) and expels the trapped water, so the cake dries out.","note":"The quantities suggested by the calculator are starting points for testing, not course values.","fix":["Replace part of the sugar with invert sugar or honey: their fructose is the most water-attracting of the sugars.","Add citrus fiber: it binds up to 10 times its weight in water and keeps baked goods moist for longer.","Avoid repeated freeze-thaw cycles, which speed up starch hardening."]}},{"id":"separate","cat":"emul","title":"الغناش أو الكريمة ينفصل ويظهر الزيت","cause":"المستحلب غير مستقر. يحدث هذا غالباً عند استبدال مكوّن يحمل مستحلباً طبيعياً (كريمة، صفار، حليب، زبدة، شوكولاتة بالحليب) بمكوّن لا يحمله مثل الماء.","fix":["حدّد نوع المستحلب أولاً: زيت في ماء أم ماء في زيت.","راجع المكونات: هل فيها مستحلب طبيعي مثل كازين الحليب أو صفار البيض؟ إن أزلتها فعوّض بمستحلب بديل.","انتبه إلى المعالجة الحرارية للكازين، فقد تُضعف جودته.","راجع طريقة التصنيع (الخلط والحرارة)، فهي جزء من اختيار المستحلب."],"note":"مبني على فيديو «كيف تختار مستحلباً».","en":{"title":"Ganache or cream separates and oil appears","cause":"The emulsion is unstable. This usually happens when an ingredient carrying a natural emulsifier (cream, yolk, milk, butter, milk chocolate) is replaced by one that does not, such as water.","note":"Based on the video «How to choose an emulsifier».","fix":["Identify the emulsion type first: oil-in-water or water-in-oil.","Check the ingredients: do they contain a natural emulsifier such as milk casein or egg yolk? If you removed it, compensate with a substitute emulsifier.","Watch out for heat treatment of casein, which can weaken its quality.","Review the process (mixing and temperature): it is part of choosing the emulsifier."]}},{"id":"which-emul","cat":"emul","title":"أي مستحلب أختار؟","cause":"الاختيار يقوم على أربعة أسئلة بهذا الترتيب.","steps":["نوع المستحلب. ماء في زيت: الليسيثين أو المونو ودايجليسريد. زيت في ماء (الأكثر في الباتسيري): خيارات أوسع.","المكونات الموجودة. الكريمة والصفار والحليب والزبدة والشوكولاتة بالحليب تحمل مستحلبات طبيعية.","القوام المطلوب. الليسيثين وألياف الحمضيات يرفعان اللزوجة. الدهون المشبعة المتبلورة قد لا تحتاج لزوجة من المستحلب.","طريقة التصنيع، لأنها تؤثر في اختيار المستحلب."],"note":"مبني على فيديو «كيف تختار مستحلباً».","en":{"title":"Which emulsifier should I choose?","cause":"The choice follows four questions, in this order.","note":"Based on the video «How to choose an emulsifier».","steps":["Emulsion type. Water-in-oil: lecithin or mono- and diglycerides. Oil-in-water (most common in pastry): a wider choice.","Ingredients already present. Cream, yolk, milk, butter and milk chocolate carry natural emulsifiers.","Texture wanted. Lecithin and citrus fiber raise viscosity. Crystallized saturated fats may not need viscosity from the emulsifier.","Process, because it affects the choice of emulsifier."]}},{"id":"wo","cat":"emul","title":"مستحلب ماء في زيت لا يثبت","cause":"بعض المستحلبات لا تناسب هذا النوع من المستحلبات.","fix":["ألياف الحمضيات وإسترات السكروز (عالية HLB) لا تعمل جيداً مع ماء في زيت.","التزم بالليسيثين أو المونو ودايجليسريد، ثم حسّن حسب حاجتك.","في الباتسيري يكثر زيت في ماء ويقل ماء في زيت."],"note":"مبني على فيديو «كيف تختار مستحلباً».","en":{"title":"Water-in-oil emulsion will not hold","cause":"Some emulsifiers do not suit this type of emulsion.","note":"Based on the video «How to choose an emulsifier».","fix":["Citrus fiber and sucrose esters (high HLB) do not work well in water-in-oil.","Stick to lecithin or mono- and diglycerides, then refine as needed.","In pastry, oil-in-water is far more common than water-in-oil."]}},{"id":"sponge","cat":"air","title":"الإسفنج ينهار أو لا تثبت بنيته","cause":"عامل الرغوة يجب أن يوفّر الهواء والبنية معاً. البروتينات النباتية لا تتجلتن في الفرن مثل بياض البيض.","fix":["غير نباتي: بياض البيض أو الأوفالبيومين المجفف يعملان كعامل رغوة وتجلتن في الفرن، فيعطيان بنية إسفنجية ثابتة.","نباتي: بروتين صويا أو بطاطس، أو أكوافابا سائلة أو مجففة، لإدخال الهواء.","نباتي: أضف مثخّناً (زانثان أو صمغ الخروب أو التارا) لتثبيت الميرنغ قبل خلطه، حتى لا ينهار.","نباتي: أضف نشاً ليقوم بدور التجلتن في الفرن، وتختلف كميته حسب وجود الغلوتين.","النكهة: درجة تكرير البروتين تؤثر في الطعم والرائحة، والكاكاو يخفيها."],"note":"مبني على فيديو «كيف تختار عامل رغوة».","en":{"title":"Sponge collapses or the structure does not set","cause":"The foaming agent must provide both air and structure. Plant proteins do not gel in the oven the way egg white does.","note":"Based on the video «How to choose a foaming agent».","fix":["Non-vegan: egg white or dried ovalbumin act as foaming and gelling agents in the oven, giving a stable sponge structure.","Vegan: soy or potato protein, or liquid or dried aquafaba, to bring in air.","Vegan: add a thickener (xanthan, locust bean gum or tara) to stabilize the meringue before folding, so it does not collapse.","Vegan: add starch to take over the gelling in the oven; the amount depends on whether gluten is present.","Flavor: the refining level of the protein affects taste and smell, and cocoa masks it."]}},{"id":"alcohol-air","cat":"air","title":"أريد هواءً خفيفاً (air) في سائل فيه كحول","cause":"الليسيثين لا يعطي النتيجة نفسها في هذا الوسط.","fix":["إسترات السكروز تكوّن مستحلبات وأهواء حتى في محاليل مائية عالية الكحول.","الجرعة للهواء من 0.1% إلى 0.3%، وللمستحلبات من 0.5% إلى 1%.","لهواء أثبت أضف عامل تجيل أو مثبّتاً.","اطلب الورقة الفنية: HLB يتراوح بين 6 و16 حسب المنتج، والقيم 15 إلى 16 تناسب زيت في ماء فقط."],"note":"من فيديو «إسترات السكروز».","en":{"title":"I want a light air in a liquid containing alcohol","cause":"Lecithin does not give the same result in this medium.","note":"From the video «Sucrose esters».","fix":["Sucrose esters form emulsions and airs even in water solutions with a lot of alcohol.","Dose for air: 0.1% to 0.3%; for emulsions: 0.5% to 1%.","For a more stable air, add a gelling agent or stabilizer.","Ask for the technical sheet: HLB ranges from 6 to 16 depending on the product, and values of 15 to 16 suit oil-in-water only."]}},{"id":"custard","cat":"thick","title":"كريمة الباتسيير أو الكاسترد حبيبية أو غير لامعة","cause":"نوع النشا أو الدقيق يغيّر القوام: حجم الحبيبات يؤثر في النعومة واللمعان.","fix":["لزوجة الكاسترد تأتي من تخثّر بروتين البيض والحليب ومن تأثير النشا المثخّن.","بدّل النوع وقارن: دقيق، نشا قمح، نشا بطاطس، نشا ذرة. لكل منها نعومة ولمعان مختلفان.","نشا الحبوب (ذرة) يختلف عن نشا الجذور والدرنات (بطاطس، تابيوكا)."],"note":"من فيديو «النشا».","en":{"title":"Pastry cream or custard is grainy or dull","cause":"The type of starch or flour changes the texture: granule size affects smoothness and shine.","note":"From the video «Starch».","fix":["Custard viscosity comes from egg and milk protein coagulation and from the thickening effect of the starch.","Swap the type and compare: flour, wheat starch, potato starch, corn starch. Each gives a different smoothness and shine.","Cereal starch (corn) differs from root and tuber starch (potato, tapioca)."]}},{"id":"less-sugar","cat":"thick","title":"أريد تقليل السكر دون أن تفقد الوصفة ثباتها","cause":"السكر يعطي مادة جافة (dry extract) وتماسكاً، وإزالته تُخلّ بالاستقرار.","fix":["الفركتانات (الإينولين والأوليغوفركتوز) ألياف ذائبة تحبس ماءً أكثر من السكر، فتعوّض المادة الجافة المفقودة.","لها أيضاً خصائص قوامية، وتساعد في استبدال الدهون."],"note":"من فيديو «الفركتانات».","en":{"title":"I want to cut the sugar without losing stability","cause":"Sugar provides dry extract and body, and removing it upsets stability.","note":"From the video «Fructans».","fix":["Fructans (inulin and oligofructose) are soluble fibers that bind more water than sugar, so they make up for the lost dry extract.","They also have texturizing properties and help replace fat."]}},{"id":"viscosity","cat":"thick","title":"اللزوجة غير مناسبة (سائلة أو ثقيلة)","cause":"اللزوجة مقاومة السائل للانسياب، وتختلف عن الكثافة: الزيت أقل كثافة من الماء لكنه أكثر لزوجة. وهي تخص السوائل فقط، فالموس بعد أن يتجيل لا تُقاس لزوجته.","fix":["من الأقل لزوجة إلى الأعلى: ماء، حليب كامل، زيت زيتون، عسل، زبدة فول سوداني.","الألياف في الهريس تحبس الماء فترفع اللزوجة.","أدوات التثخين: النشا، الفركتانات، صمغ الزانثان (مثخّن قوي يُستخدم بتراكيز منخفضة جداً)."],"note":"من فيديو «مقدمة تقنية التكثيف».","en":{"title":"Viscosity is wrong (too runny or too heavy)","cause":"Viscosity is a liquid's resistance to flow, and it differs from density: oil is less dense than water but more viscous. It applies to liquids only, so a set mousse has no measurable viscosity.","note":"From the video «Introduction to thickening».","fix":["From lowest to highest viscosity: water, whole milk, olive oil, honey, peanut butter.","Fiber in purées binds water and raises viscosity.","Thickening tools: starch, fructans, xanthan gum (a very strong thickener used at very low doses)."]}},{"id":"freeze","cat":"texture","title":"القوام يتضرر بعد التجميد والإذابة","cause":"دورات التجميد والإذابة تسرّع تصلب النشا وفقدان الماء.","fix":["ألياف الحمضيات تتحمل التجميد والإذابة.","تجنّب تكرار الدورة على المنتج نفسه."],"note":"من قراءتي النشا والألياف.","en":{"title":"Texture is damaged after freezing and thawing","cause":"Freeze-thaw cycles speed up starch hardening and water loss.","note":"From my reading of the starch and fiber lessons.","fix":["Citrus fiber withstands freezing and thawing.","Avoid repeating the cycle on the same product."]}},{"id":"meringue-flex","cat":"air","title":"الميرنغ بالبيض الطازج يتيبس ويفقد المرونة عند الدمج","cause":"البيض الطازج يُخفق بسرعة لكن الرغوة تفقد مرونتها (روابط ثنائي الكبريتيد بين البروتينات). الإفراط في الخفق يزيد الأمر.","fix":["أضف حمضاً: 0.5% كريم تارتار (59.5% بياض + 0.5% + 40% سكر)، أو قطرات ليمون أو حمض الطرطريك أو الستريك.","الحمض يصعّب تكوّن الروابط فتبقى الرغوة ليّنة ومرنة أطول، ويمكنك خفض السرعة وإبقاؤها.","سخّن البياض إلى نحو 30°م قبل الخفق، اخفق 3 دقائق ثم أضف السكر واخفق نحو 7 دقائق."],"note":"من فيديو بروتينات البيض. ملاحظة الدورة: الملح المذكور في الكتب القديمة ليس الحل.","en":{"title":"French meringue with fresh egg whites turns stiff and loses flexibility when folded","cause":"Fresh egg whites whip fast, but the foam loses its flexibility (disulfide bonds between proteins). Over-whipping makes it worse.","note":"From the egg proteins video. The course notes that the salt mentioned in old books is not the fix.","fix":["Add an acid: 0.5% cream of tartar (59.5% white + 0.5% + 40% sugar), or a few drops of lemon, tartaric or citric acid.","The acid makes bonds harder to form, so the foam stays soft and flexible longer, and you can lower the speed and hold it.","Warm the whites to about 30°C before whipping, whip 3 minutes, then add the sugar and whip about 7 minutes."]}},{"id":"pasteurized-white","cat":"air","title":"بياض البيض المبستر لا يرتفع جيداً","cause":"التبستر الشديد قد يُضعف بنية البروتين، فتقلّ قدرة الرغوة على التماسك.","fix":["جرّب أولاً كما هو مع السكر، فغالباً يخفق جيداً.","إن ظهر ضعف في البنية أضف نسبة من الألبومين المجفف (بودرة) لتقوية الرغوة.","ابتعد عن الحموضة الشديدة (pH أقل من 2) لأنها تضر الرغوة."],"note":"من فيديو بروتينات البيض. نسبة الألبومين لم تحدَّد في الدورة، فجرّبها بنفسك تدريجياً.","en":{"title":"Pasteurized egg white does not rise well","cause":"Strong pasteurization can weaken the protein structure, so the foam holds together less well.","note":"From the egg proteins video. The course gives no albumen percentage, so test it gradually.","fix":["Try it as it is with the sugar first; it usually whips well.","If the structure is weak, add some dried albumen powder to reinforce the foam.","Avoid very acidic conditions (pH below 2), which harm foaming."]}},{"id":"fat-kills-foam","cat":"air","title":"الرغوة تنهار عند إضافة دهن (شوكولاتة، مكسرات، صفار)","cause":"جزء البروتين الكاره للماء يتجه إلى الدهن بدل الهواء، فيتنافس الاثنان وينقص حجم الرغوة.","fix":["اخفق الرغوة أولاً حتى تكتمل ثم أضف الدهن بلطف في النهاية.","قلّل كمية الدهن ما أمكن، أو اقبل بحجم أقل.","إن كان الدهن كثيراً فاعتمد مثبتاً إضافياً مثل الجيلاتين بدل الاعتماد على رغوة البيض فقط."],"note":"من فيديو بروتينات البيض.","en":{"title":"Foam collapses when fat is added (chocolate, nuts, yolk)","cause":"The hydrophobic part of the protein goes to the fat instead of the air, so the two compete and the foam volume drops.","note":"From the egg proteins video.","fix":["Whip the foam to completion first, then fold in the fat gently at the end.","Reduce the fat as much as possible, or accept a lower volume.","If there is a lot of fat, rely on an extra stabilizer such as gelatine instead of egg foam alone."]}},{"id":"alcohol-limit","cat":"air","title":"الرغوة لا تثبت مع الكحول","cause":"الكحول يمسخ (يفسد) البروتينات، لكن لكل بروتين تحمّل مختلف.","fix":["حتى نحو 10% كحول لا يتأثر بياض البيض كثيراً.","فوق ذلك استخدم بروتيناً أو مستحلباً أقوى مثل استرات السكروز، أو أضف الكحول في النهاية بكمية قليلة.","الزانثان يتحمل الكحول حتى نحو 60% إن احتجت تكثيفاً."],"note":"من فيديوهات بروتينات البيض والزانثان وتطبيق «بيلي كريمي نباتي».","en":{"title":"Foam does not hold with alcohol","cause":"Alcohol denatures proteins, but each protein tolerates it differently.","note":"From the egg proteins, xanthan and vegan Baileys application videos.","fix":["Up to about 10% alcohol, egg white is not much affected.","Above that, use a stronger protein or emulsifier such as sucrose esters, or add the alcohol last in a small amount.","Xanthan tolerates alcohol up to about 60% if you need thickening."]}},{"id":"overwhipped","cat":"air","title":"الرغوة خشنة ومتحبّبة بعد الخفق الزائد","cause":"الإفراط في الخفق يكوّن روابط كثيرة بين البروتينات فتفقد الرغوة مرونتها.","fix":["أضف الحمض (كريم تارتار) من البداية لتبقى الرغوة مرنة.","أوقف الخفق عند القوام المطلوب وخفّض السرعة للإبقاء عليها.","لا تحاول إصلاحها بإضافة بياض جديد بكثرة، فالأفضل إعادة المحاولة."],"note":"من فيديو بروتينات البيض.","en":{"title":"Foam is coarse and grainy after over-whipping","cause":"Over-whipping creates too many bonds between proteins, so the foam loses its flexibility.","note":"From the egg proteins video.","fix":["Add the acid (cream of tartar) from the start to keep the foam flexible.","Stop whipping at the texture you need and lower the speed to hold it.","Do not try to rescue it by adding a lot of fresh white; it is better to start again."]}},{"id":"lumps","cat":"thick","title":"كتل في الكريمة عند إضافة النشا أو الألياف أو الصمغ","cause":"المسحوق ارتبط بالماء من الخارج قبل أن يتفرّق، فتكونت كتل جافة من الداخل.","fix":["فرّق المسحوق جيداً قبل الترطيب: اخلطه مع السكر أو جزء من المكونات الجافة ثم أضفه.","استعمل خلاطاً يدوياً (بلندر) عند إضافته، ويُفضَّل التفريق على البارد للنشا.","انتظر قليلاً بعد الإضافة ليلتقط الماء وتزيد اللزوجة (خاصة مع ألياف الحمضيات)."],"note":"من فيديوهات النشا والزانثان وألياف الحمضيات.","en":{"title":"Lumps in the cream when adding starch, fiber or gum","cause":"The powder hydrated on the outside before it dispersed, forming dry-centered lumps.","note":"From the starch, xanthan and citrus fiber videos.","fix":["Disperse the powder before hydrating: mix it with sugar or part of the dry ingredients, then add it.","Use a hand blender when adding it; for starch, disperse cold is best.","Wait a little after adding so it can bind the water and viscosity builds (especially with citrus fiber)."]}},{"id":"starch-temp","cat":"thick","title":"الكاسترد لم يثخن أو رقّ بعد الطبخ","cause":"في كريمة فيها صفار، السبب الأول هو إنزيم ألفا-أميليز الموجود في الصفار: إن لم يُعطَّل بالغليان فهو يفكّك النشا فتتسيّح الكريمة بعد ساعات أو في اليوم التالي. أما في كريمة بالنشا فقط فيكتمل التهلّم قرب 80°م، والإفراط الشديد في الطبخ أو الخفق القوي بعده يكسر الحبيبات.","fix":["إن كان في الكريمة صفار: يجب أن تغلي وتبقى على الغليان 1-2 دقيقة مع التحريك المستمر (فوق 85°م) ليتعطّل الأميليز. هذا عكس «لا تطبخ أكثر من اللازم».","لا تكتفِ ببلوغ 65-70°م: يكفي ذلك لتخثّر الصفار لكنه لا يعطّل الأميليز، فترقّ الكريمة لاحقاً.","كريمة بالنشا فقط بلا صفار: نشا البطاطس يكمل جلتنته عند نحو 65°م والذرة أو الأرز عند نحو 80°م، ولا حاجة لإطالة الغليان، والإفراط يكسر الحبيبات.","السكر الكثير ينافس النشا على الماء فيقلل لزوجته، فاضبط الكمية.","بعد الطبخ برّد بسرعة، ولا تخفق بقوة إلا إن كان القوام ثقيلاً."],"note":"من فيديو النشويات، مع تصحيح الأميليز في الصفار.","en":{"title":"Custard did not thicken or thinned after cooking","cause":"In a cream that contains egg yolk, the first cause is alpha-amylase in the yolk: if the cream is not boiled to deactivate it, it breaks the starch down and the cream thins after some hours or the next day. In a starch-only cream, gelatinization completes near 80°C, and heavy over-cooking or hard whisking afterwards breaks the granules.","note":"From the starches video, with the yolk amylase correction.","fix":["If the cream contains yolk: it must come to a boil and stay boiling for 1-2 minutes with constant stirring (above 85°C) to deactivate the amylase. This is the opposite of “do not over-cook”.","Do not stop at 65-70°C: that coagulates the yolk but does not deactivate the amylase, so the cream thins later.","Starch-only cream without yolk: potato starch completes gelatinization at about 65°C, corn or rice starch at about 80°C. No long boil is needed, and over-cooking breaks the granules.","A lot of sugar competes with the starch for water and lowers its viscosity, so adjust the amount.","Chill quickly after cooking, and do not whisk hard unless the texture is too heavy."]}},{"id":"custard-gel-heavy","cat":"thick","title":"الكاسترد متماسك جداً (هلامي) وأريده كريمياً","cause":"النشا الغني بالأميلوز (ذرة، بطاطس، قمح، كودزو) يكوّن هلاماً مع بروتين البيض.","fix":["اخلطه بالبلندر بعد الطبخ لكسر الروابط وتحويله إلى قوام لزج غير متصلب.","استعمل نشاً قليل الأميلوز (مثل الذرة الشمعية 99% أميلوبكتين) فهو يثخن ولا يتهلم.","لا تبالغ بالخلط إذا كانت اللزوجة مناسبة لأنه يخفضها."],"note":"من فيديو النشويات.","en":{"title":"Custard is too firm (gelled) and I want it creamy","cause":"Starch rich in amylose (corn, potato, wheat, kudzu) forms a gel together with egg protein.","note":"From the starches video.","fix":["Blend it after cooking to break the bonds and turn it into a thick, non-stiff texture.","Use a low-amylose starch (such as waxy corn at 99% amylopectin): it thickens without gelling.","Do not over-blend if the viscosity is right, because it lowers it."]}},{"id":"acid-starch","cat":"thick","title":"الكريمة الحمضية (ليمون، باشن فروت) رقّت أو تقطعت","cause":"النشا الطبيعي غير مستقر في الوسط الحمضي، أما الزانثان فيعمل من pH 1 إلى 13.","fix":["استعمل نشاً معدلاً (مثل كريمة الليمون curd) أو زانثان بنسبة 0.2-0.3%.","الزانثان يبدأ التكثيف من 0.05% ولا يُنصح بتجاوز نحو 0.5% في الحلويات.","النشا الطبيعي يُترك للوسط المحايد."],"note":"من فيديوهات الزانثان والنشا وتطبيق «كريمة الليمون».","en":{"title":"Acidic cream (lemon, passion fruit) thinned or broke","cause":"Native starch is unstable in an acidic medium, while xanthan works from pH 1 to 13.","note":"From the xanthan and starch videos and the lemon curd application.","fix":["Use a modified starch (as in lemon curd) or xanthan at 0.2-0.3%.","Xanthan starts thickening from 0.05%, and going above about 0.5% is not advised in desserts.","Leave native starch for neutral media."]}},{"id":"casein-acid","cat":"emul","title":"كريمي بالحمضيات (ليمون) انفصل أو تقطع مع الوقت","cause":"الكازين يتخثر عند نقطته المتعادلة (pH نحو 4.6)، والحمض المضاف على قاعدة دافئة (40-45°م) يرسّبه فينكسر المستحلب، وقد يظهر بعد التجميد والإذابة.","fix":["أضف الحمض بعد تبريد القاعدة جيداً (من 4 إلى 6°م).","ابقَ فوق pH 4.6 إن كان الكازين هو المستحلب.","إن لم تنفع فاستبدله بألياف الحمضيات كمستحلب."],"note":"من فيديو بروتينات الحليب (تجربة الكريمي بالليمون الأخضر).","en":{"title":"Citrus creamy split or curdled over time","cause":"Casein curdles at its isoelectric point (pH about 4.6). Acid added to a warm base (40-45°C) precipitates it and breaks the emulsion, which can show after freezing and thawing.","note":"From the milk proteins video (lime creamy experience).","fix":["Add the acid after the base is well chilled (4 to 6°C).","Stay above pH 4.6 if casein is the emulsifier.","If that does not work, swap in citrus fiber as the emulsifier."]}},{"id":"citrus-fiber-dose","cat":"emul","title":"ما كمية ألياف الحمضيات المناسبة؟ ولا تعمل مع البرالين؟","cause":"تعمل ممتازة في مستحلب زيت في ماء، لكنها تفقد قدرتها عندما تزيد الدهون جداً (برالين 30-50%).","fix":["الموس: ابدأ بنحو 1%.","الكريمي: 1% وإن كان سيُجمَّد فاذهب إلى 1.5% (لأن الماء يتمدد بلا فراغات هوائية).","النطاق العام من 0.5% إلى 1.5%، وتعمل على الحرارة العادية (نحو 20°م)، ويمكن إضافتها للماء أو الدهن.","مع برالين المكسرات بنسب عالية استعمل الليسيثين."],"note":"من فيديو ألياف الحمضيات.","en":{"title":"How much citrus fiber? And does it work with praline?","cause":"It works very well in oil-in-water emulsions, but loses its power when fat is very high (praline 30-50%).","note":"From the citrus fiber video.","fix":["Mousse: start at about 1%.","Creamy: 1%, and if it will be frozen go to 1.5% (the water expands with no air pockets).","The general range is 0.5% to 1.5%; it works at room temperature (about 20°C) and can go into the water or the fat.","With high nut praline levels, use lecithin."]}},{"id":"lecithin-high-fat","cat":"emul","title":"الكريمي بالبرالين أو المكسرات دهني وينفصل","cause":"الدهن الكثير يغيّر نوع المستحلب نحو ماء في زيت، فيحتاج مستحلباً محباً للدهن.","fix":["استعمل الليسيثين (في حدود 0-0.5%) عندما تكون نسبة البرالين عالية.","الكازين يمكنه استحلاب برالين البندق في الماء دون حرارة بوجود قوة ميكانيكية.","إن ظهر طعم الليسيثين فقلّل الجرعة."],"note":"من فيديوهات ألياف الحمضيات وبروتينات الحليب وتطبيق «كريمي البندق».","en":{"title":"Creamy with praline or nuts is oily and separates","cause":"High fat shifts the emulsion toward water-in-oil, which needs a fat-loving emulsifier.","note":"From the citrus fiber and milk proteins videos and the hazelnut creamy application.","fix":["Use lecithin (within 0-0.5%) when the praline level is high.","Casein can emulsify hazelnut praline into water without heat, with mechanical force.","If a lecithin taste shows, reduce the dose."]}},{"id":"water-ganache","cat":"emul","title":"أريد غناش بالماء بدل الكريمة (بدون طعم ألبان)","cause":"الكريمة تحمل كازين يستحلب الدهن، فإن أُزيلت ضاع المستحلب.","fix":["أضف بروتين حليب مركّز/معزول (يحتوي 20-90% بروتين) إلى الماء وحلّله جيداً قبل المزج بالشوكولاتة.","بالماء استعمل نحو 1.5-2%، وبالكريمة تكفي 0.5-1.5% من البروتين الكلي.","عوّض اللزوجة التي كانت يعطيها الدهن بمثخّن أو قليل من الليسيثين."],"note":"من فيديو بروتينات الحليب.","en":{"title":"I want a water ganache instead of cream (no dairy taste)","cause":"Cream carries casein, which emulsifies the fat; remove it and the emulsifier is gone.","note":"From the milk proteins video.","fix":["Add milk protein concentrate or isolate (20-90% protein) to the water and disperse it well before mixing with the chocolate.","With water use about 1.5-2%, while with cream 0.5-1.5% total protein is enough.","Make up the viscosity that the fat gave with a thickener or a little lecithin."]}},{"id":"emulsifier-melt","cat":"emul","title":"المستحلب لا يذوب أو يظهر حبيبات","cause":"بعض المستحلبات تحتاج حرارة مناسبة: أحادي/ثنائي الجليسريد يذوب عند نحو 65°م.","fix":["سخّن الطور المذاب فيه إلى 65°م على الأقل ثم اخلط.","الألياف والبروتينات تعمل على الحرارة العادية فاختر ما يناسب طريقتك."],"note":"من فيديو المستحلبات.","en":{"title":"Emulsifier does not dissolve or leaves grains","cause":"Some emulsifiers need the right temperature: mono- and diglycerides melt at about 65°C.","note":"From the emulsifiers video.","fix":["Heat the phase it dissolves in to at least 65°C, then mix.","Fiber and proteins work at room temperature, so choose what fits your process."]}},{"id":"freeze-split","cat":"texture","title":"الكريمي ينفصل بعد التجميد والإذابة","cause":"الماء يتمدد عند التجمد فيخرّب البنية، والكريمي المتراص بلا هواء أكثر تضرراً من الموس.","fix":["ارفع المستحلب (ألياف الحمضيات 1.5% للكريمي المجمّد).","أضف نحو 0.2-0.3% زانثان فهو يحسّن ثبات التجميد والإذابة ويقلل خروج الماء.","استعمل النشا المعدل في الكاسترد المجمّد."],"note":"من فيديوهات ألياف الحمضيات والزانثان والنشا.","en":{"title":"Creamy separates after freezing and thawing","cause":"Water expands when it freezes and damages the structure; a compact creamy with no air suffers more than a mousse.","note":"From the citrus fiber, xanthan and starch videos.","fix":["Raise the emulsifier (citrus fiber 1.5% for a frozen creamy).","Add about 0.2-0.3% xanthan: it improves freeze-thaw stability and reduces water release.","Use a modified starch in a frozen custard."]}},{"id":"syneresis","cat":"texture","title":"ماء يخرج من الكريمة أو الحشوة مع الوقت (سينيريسيس)","cause":"في كاسترد الصفار والنشا الأسباب الأكثر شيوعاً: طبخ ناقص (لم تغلِ فيبقى الأميليز)، أو إعادة تبلور النشا بعد التبريد والتخزين، أو التجميد. نقص المثخّن سبب أقل شيوعاً ولا يُبدأ به.","fix":["راجع الطبخ أولاً: كريمة الصفار والنشا يجب أن تغلي 1-2 دقيقة فوق 85°م مع التحريك.","إن ظهر الماء بعد أيام من التخزين فهذه إعادة تبلور النشا: جرّب نشاً معدلاً أو ذرة شمعية، وتجنب تقلب الحرارة.","إن جُمّدت الكريمة فالنشا العادي يفقد ماءه عند الإذابة، فاستعمل نشاً معدلاً للتجميد.","فقط إن بقيت المشكلة بعد ذلك: زانثان 0.2-0.3% (اختياري وليس الحل الأول). اخلطه مع السكر أولاً ثم أضفه بالبلندر لتتجنب الكتل، وزيادته تعطي قواماً لزجاً.","مع بروتين حليب كثير وانفصال ظاهر أضف كابا كاراجينان بنسبة قليلة جداً.","اترك الزانثان مع الوقت للتماسك قبل الحكم."],"note":"من فيديو الزانثان، بعد ترتيب الأسباب بحسب شيوعها في الكاسترد.","en":{"title":"Water leaks from the cream or filling over time (syneresis)","cause":"In a yolk-and-starch custard the most common causes are under-cooking (it did not boil, so the amylase survives), starch retrogradation after chilling and storage, or freezing. A lack of thickener is a less common cause and is not where to start.","note":"From the xanthan video, with causes re-ordered by how common they are in custard.","fix":["Check the cooking first: a yolk-and-starch cream must boil for 1-2 minutes above 85°C with stirring.","If water appears after days of storage, that is starch retrogradation: try a modified starch or waxy corn starch, and avoid temperature swings.","If the cream was frozen, ordinary starch loses water on thawing, so use a modified starch for freezing.","Only if the problem remains: xanthan 0.2-0.3% (optional, not the first fix). Mix it with the sugar first and add it with a hand blender to avoid lumps; too much gives a slimy texture.","With a lot of milk protein and visible separation, add a very small amount of kappa carrageenan.","Give xanthan time to settle before judging."]}},{"id":"xanthan-slimy","cat":"thick","title":"القوام لزج ومطاطي (صمغي)","cause":"زانثان زائد: فوق نحو 0.2-0.3% يظهر قوام غير مرغوب عند غرس الملعقة.","fix":["قلّل الجرعة: 0.2-0.3% حد أقصى عملياً، و0.5-0.7% فقط للهريس الكثيف.","اخلط بالبلندر فيرق القوام (shear thinning) ثم يعود تدريجياً مع الراحة.","الحرارة فوق 90°م تخفض اللزوجة قليلاً."],"note":"من فيديو الزانثان.","en":{"title":"Texture is slimy and gummy","cause":"Too much xanthan: above about 0.2-0.3% an unpleasant texture shows when you put a spoon in.","note":"From the xanthan video.","fix":["Reduce the dose: 0.2-0.3% is the practical limit, and 0.5-0.7% only for thick purées.","Blend it and the texture thins (shear thinning), then returns gradually at rest.","Heat above 90°C lowers viscosity slightly."]}},{"id":"soy-foam","cat":"air","title":"رغوة بروتينات نباتية (صويا، بطاطس) غير ثابتة","cause":"البروتين النباتي يرغي لكنه لا يتخثر بالحرارة كالبيض، وثباته ضعيف.","fix":["استعمل حتى 3% بروتين نباتي مع زانثان لتثبيت الرغوة.","يمكن أيضاً استعمال أكواهافا (ماء الحمص) أو الاسترات السكرية.","في الإسفنج النباتي استعن بالنشا لتعويض خصائص البيض."],"note":"من فيديو البروتينات النباتية وأكواهافا.","en":{"title":"Plant-protein foam (soy, potato) is unstable","cause":"Plant protein foams but does not coagulate with heat like egg, and its stability is weak.","note":"From the plant proteins and aquafaba videos.","fix":["Use up to 3% plant protein with xanthan to stabilize the foam.","You can also use aquafaba (chickpea water) or sugar esters.","In a vegan sponge, rely on starch to replace the egg's properties."]}},{"id":"marshmallow-set","cat":"air","title":"المارشميلو لا يثبت أو ينكمش","cause":"الجيلاتين (نحو 5-6%) هو العامل الرغوي والهلامي، وأي خلل في الحرارة أو التركيز يضعفه.","fix":["استعمل نحو 5-6% جيلاتين مرطّباً جيداً ثم مذاباً.","عند الصيف برّد الوعاء قبل الخفق.","استعمل مسدس الحرارة لتسوية السطح أو إزالة الفقاعات."],"note":"من فيديو المارشميلو بالتوت.","en":{"title":"Marshmallow does not set or shrinks","cause":"Gelatine (about 5-6%) is both the foaming and the gelling agent, and any fault in temperature or concentration weakens it.","note":"From the raspberry marshmallow video.","fix":["Use about 5-6% gelatine, well hydrated and then melted.","In summer, chill the bowl before whipping.","Use a heat gun to level the surface or remove bubbles."]}},{"id":"pectin-fail","cat":"thick","title":"البكتين لا يتجلّط في الكريمة أو المربى","cause":"البكتين له شروط محددة: pH وكمية سكر، أو نوع NH لا يحتاج حمضاً.","fix":["البكتين العالي الأسترة يحتاج سكراً كثيراً ووسطاً حمضياً.","استعمل بكتين NH أو خالياً من الحمض مع الفواكه قليلة الحموضة.","إن كان الكريمي ثقيلاً بعد التجلط اخلطه أو قلل البكتين."],"note":"من فيديوهات التجلط وتطبيقات الكريمي.","en":{"title":"Pectin does not set in the cream or jam","cause":"Pectin has specific conditions: pH and sugar level, or an NH type that needs no acid.","note":"From the gelation videos and creamy applications.","fix":["High-methoxyl pectin needs a lot of sugar and an acidic medium.","Use NH pectin or an acid-free type with low-acid fruits.","If the creamy is heavy after setting, blend it or reduce the pectin."]}},{"id":"inulin-hydrolysis","cat":"thick","title":"الإينولين لا يعطي القوام الكريمي المتوقع","cause":"الإينولين والأوليغوفركتوز يتأثران بالحرارة العالية (يتحلل نحو 95°م) ويختلفان بطول السلسلة: كلما طالت زادت قوة التكثيف.","fix":["لا تسخّنه فوق ما يلزم، وفرّقه جيداً لتجنب الكتل.","استعمل الإينولين للقوام الكريمي بالفاكهة (مثل اليوسفي) وللميرنغ الإيطالي حين تريد ثباتاً بسكر أقل.","السلاسل الأطول تعطي لزوجة أعلى."],"note":"من فيديو الإينولين وتطبيقات اليوسفي والميرنغ.","en":{"title":"Inulin does not give the expected creamy texture","cause":"Inulin and oligofructose are affected by high heat (hydrolysis at about 95°C) and differ by chain length: the longer the chain, the stronger the thickening.","note":"From the inulin video and the mandarin and meringue applications.","fix":["Do not heat it more than needed, and disperse it well to avoid lumps.","Use inulin for fruit creamy textures (such as mandarin) and for Italian meringue when you want stability with less sugar.","Longer chains give higher viscosity."]}},{"id":"sponge-soak","cat":"cake","title":"الإسفنج يمتص رطوبة الكريمة ويصير طرياً جداً","cause":"الماء ينتقل من الكريمة الرطبة إلى الإسفنج.","fix":["انتظر ساعة إلى ساعة ونصف قبل سكب الكريمة أو الموس.","استعمل مثخّن يمسك الماء (ألياف الحمضيات أو الزانثان) فيقل الانتقال.","يمكن تغليف الإسفنج بطبقة دهنية رقيقة."],"note":"الانتظار من تطبيقات الدورة، والباقي اجتهاد مني ويحتاج تجربة.","en":{"title":"Sponge soaks up moisture from the cream and gets too soft","cause":"Water moves from the wet cream into the sponge.","note":"The waiting time comes from the course applications; the rest is my own suggestion and needs testing.","fix":["Wait one to one and a half hours before pouring the cream or mousse.","Use a thickener that holds water (citrus fiber or xanthan) so less water migrates.","You can seal the sponge with a thin fat layer."]}},{"id":"fat-sugar-less-cake","cat":"cake","title":"أريد تقليل الدهن أو البيض في الكيك","cause":"ألياف الحمضيات تمسك الماء وتبني بنية فتعوّض جزءاً من الدهن والبيض.","fix":["أضف 1-1.5% ألياف حمضيات مع ماء إضافي.","يمكن تقليل البيض والدهن حتى 50% في الدورة مع زيادة الماء."],"note":"من فيديو ألياف الحمضيات. جرّب بالتدريج وراقب القوام.","en":{"title":"I want less fat or egg in the cake","cause":"Citrus fiber holds water and builds structure, so it replaces part of the fat and egg.","note":"From the citrus fiber video. Test gradually and watch the texture.","fix":["Add 1-1.5% citrus fiber with extra water.","In the course, egg and fat can be cut by up to 50% while increasing the water."]}},{"id": "cake-sink", "cat": "cake", "title": "الكيكة تهبط في المنتصف بعد الخبز", "cause": "البنية لم تتماسك قبل خروج الكيكة: فتح الفرن مبكراً، أو حرارة منخفضة، أو بيكنج باودر زائد يرفع العجين أسرع مما تثبت البنية، أو سائل وسكر زائدان.", "fix": ["لا تفتح الفرن في أول 2/3 من وقت الخبز.", "تأكد من حرارة الفرن بترمومتر داخلي، فكثير من الأفران تخطئ بـ 10-20°م.", "قِس البيكنج باودر بدقة بالغرام، وقلّل الزائد (عادة نحو 2.5-4% من وزن الدقيق في الكيك العادي).", "تأكد من النضج: عود يخرج نظيفاً، أو حرارة المركز نحو 96-98°م.", "اترك الكيكة في الفرن المغلق 5 دقائق بعد الإطفاء إن كانت تهبط عند الإخراج."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Cake sinks in the middle after baking", "cause": "The structure had not set before the cake left the oven: opening the oven early, low temperature, too much baking powder that lifts faster than the structure sets, or too much liquid and sugar.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Do not open the oven in the first two thirds of the bake.", "Check the real oven temperature with a thermometer: many ovens are off by 10-20°C.", "Weigh the baking powder (usually about 2.5-4% of flour weight in a standard cake) and cut it if in excess.", "Check doneness: a skewer comes out clean, or the centre reaches about 96-98°C.", "Leave the cake in the switched-off oven for 5 minutes if it sinks on removal."]}},{"id": "cake-dome", "cat": "cake", "title": "الكيكة تنتفخ كقبة وتتشقق من الوسط", "cause": "الحواف والسطح يثبتان قبل الوسط بسبب حرارة عالية، فيندفع الوسط للأعلى ويتشقق.", "fix": ["خفّض حرارة الفرن 10-20°م وأطل الخبز قليلاً.", "استعمل شريط عزل مبلل حول القالب أو قالباً أثقل لتتساوى حرارة الحواف والوسط.", "ضع الكيكة في منتصف الفرن ولا تقرّبها من العنصر العلوي.", "إن كانت وصفتك فيها بيكنج باودر وتكرر المشكل فقلّله."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Cake domes and cracks in the centre", "cause": "The edges and top set before the centre because the heat is too high, so the centre pushes up and cracks.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Lower the oven by 10-20°C and bake a little longer.", "Use a wet insulating strip around the pan, or a heavier pan, so the edges and centre heat evenly.", "Bake in the middle of the oven, away from the top element.", "If your recipe contains baking powder and it keeps happening, reduce it."]}},{"id": "cake-dense", "cat": "cake", "title": "الكيكة ثقيلة وكثيفة (غير هشّة)", "cause": "غلوتين زائد من خلط طويل بعد إضافة الدقيق، أو مكونات باردة لا تستحلب فتخرج الهواء، أو دقيق أكثر من اللازم، أو هواء قليل في خفق الزبدة والسكر.", "fix": ["اخلط بعد إضافة الدقيق فقط حتى يختفي الدقيق، ولا تزد.", "اجعل الزبدة والبيض واللبن في حرارة الغرفة (نحو 20°م) ليستحلبوا ويحبسوا الهواء.", "اخفق الزبدة والسكر جيداً حتى تصير فاتحة ومنتفخة.", "زِن الدقيق ولا تكتله بالكوب، لأن الكوب يعطي كمية أكبر."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Cake is heavy and dense", "cause": "Too much gluten from long mixing after the flour is added, cold ingredients that do not emulsify and lose air, too much flour, or too little air from creaming the butter and sugar.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["After adding the flour, mix only until it disappears, no longer.", "Bring the butter, eggs and milk to room temperature (about 20°C) so they emulsify and trap air.", "Cream the butter and sugar until pale and fluffy.", "Weigh the flour rather than scooping it, because a cup gives more flour."]}},{"id": "fruit-sink", "cat": "cake", "title": "الفواكه أو قطع الشوكولاتة تغوص إلى قاع الكيكة", "cause": "العجينة رقيقة لا تحمل القطع الثقيلة، أو القطع رطبة ومبللة بالسكر فتنزلق.", "fix": ["جفف الفاكهة جيداً ودحرجها في قليل من الدقيق (من وزن الوصفة) قبل إضافتها.", "قطّع القطع أصغر وأخف.", "اجعل العجينة أكثف قليلاً، أو أضف الفاكهة في آخر لحظة بقلب خفيف.", "اخبز على حرارة تثبّت العجين سريعاً ولا تبدأ بحرارة منخفضة جداً."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Fruit or chocolate pieces sink to the bottom of the cake", "cause": "The batter is too thin to hold heavy pieces, or the pieces are wet and syrupy so they slip down.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Dry the fruit well and toss it in a little flour (taken from the recipe) before adding.", "Cut the pieces smaller and lighter.", "Make the batter a little thicker, or fold the fruit in at the last moment.", "Bake at a temperature that sets the batter quickly, not a very low start."]}},{"id": "tart-shrink", "cat": "texture", "title": "عجينة التارت تنكمش وتنزل عن جدران القالب", "cause": "غلوتين مفرط من العجن الزائد، أو عجينة لم ترتح، أو شدّها وهي باردة عند التشكيل فتعود لوضعها أثناء الخبز.", "fix": ["اخلط حتى تتجمع العجينة فقط، ولا تعجنها.", "أرح العجينة في الثلاجة 2 ساعات على الأقل (ويفضل ليلة) قبل الفرد وبعد التشكيل.", "لا تشدّ العجينة داخل القالب بل ضعها بلطف وادفعها في الزوايا.", "جمّد القالب المشكّل 20-30 دقيقة قبل الخبز الأعمى."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Tart dough shrinks and slides down the sides", "cause": "Too much gluten from over-working, dough that did not rest, or stretching the cold dough while lining so it springs back in the oven.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Mix only until the dough comes together, do not knead.", "Rest the dough in the fridge at least 2 hours (ideally overnight), both before rolling and after lining.", "Do not stretch the dough into the tin: lay it in gently and press into the corners.", "Freeze the lined tin for 20-30 minutes before blind baking."]}},{"id": "tart-soggy", "cat": "texture", "title": "قاعدة التارت تتبلل وتفقد القرمشة", "cause": "القاعدة لم تُخبز كفاية قبل الحشو، أو الحشو رطب ويسرّب ماءه، أو التارت بقي مملوءاً ساعات قبل التقديم.", "fix": ["اخبز القاعدة خبزاً أعمى كاملاً حتى يتلوّن قاعها أيضاً، لا حتى تجف فقط.", "ادهن القاعدة وهي ساخنة بطبقة عازلة: بيض مخفوق مخبوز دقيقة، أو شوكولاتة بيضاء/داكنة، أو زبدة كاكاو.", "استعمل كريمة حشو أثخن أو قلّل مائها، واحشُ قبل التقديم قدر الإمكان.", "احفظ القواعد في وعاء مغلق جاف وبعيداً عن الرطوبة."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Tart base goes soggy and loses crispness", "cause": "The base was not baked enough before filling, the filling leaks water, or the filled tart sat for hours before serving.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Blind bake the base fully until the bottom colours too, not only until it is dry.", "Seal the hot base with a barrier: egg wash baked for a minute, white or dark chocolate, or cocoa butter.", "Use a thicker filling or reduce its water, and fill as close to serving as possible.", "Store the shells in a dry airtight container away from humidity."]}},{"id": "cookies-spread", "cat": "texture", "title": "البسكويت أو الكوكيز ينتشر ويصير رقيقاً", "cause": "زبدة طرية جداً أو شبه ذائبة، أو سكر زائد، أو دقيق قليل، أو وضع العجين على صينية ساخنة.", "fix": ["اجعل الزبدة طرية ولكن باردة نسبياً (نحو 17-19°م)، لا لينة جداً.", "برّد العجين في الثلاجة 1-24 ساعة قبل الخبز، فالتبريد يثبّت الدهن.", "لا تضع العجين على صينية ساخنة وبدّل الصينية أو برّدها.", "راجع نسبة الدقيق: زيادة 10-20 غ لكل 500 غ تغيّر الانتشار كثيراً."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Cookies spread and turn thin", "cause": "Butter that is too soft or nearly melted, too much sugar, too little flour, or dough placed on a hot tray.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Use soft but still cool butter (about 17-19°C), not very soft.", "Chill the dough for 1-24 hours before baking: chilling firms up the fat.", "Never place dough on a hot tray: swap or cool the tray.", "Check the flour: adding 10-20 g per 500 g changes the spread a lot."]}},{"id": "choux-flat", "cat": "texture", "title": "عجينة الشو (إكلير) لا تنتفخ أو تنهار بعد الخروج", "cause": "الرطوبة غير مضبوطة: عجينة مبللة (بيض زائد أو لم تُجفّف على النار)، أو خروج البخار مبكراً بفتح الفرن، أو حرارة منخفضة، أو خبز ناقص فلا تثبت القشرة.", "fix": ["جفّف العجينة (panade) على النار 1-2 دقيقة مع التحريك حتى تتشكل طبقة رقيقة في القاع.", "أضف البيض تدريجياً حتى تصير العجينة لامعة ومتدلية كحرف V، ولا تضف الكل دفعة واحدة.", "ابدأ بحرارة عالية (نحو 200-210°م) ثم خفّضها، ولا تفتح الفرن أثناء الانتفاخ.", "اخبز حتى يتلوّن بعمق، وفي النهاية اترك الفرن مفتوحاً قليلاً أو اثقبها لتخرج البخار."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Choux does not rise or collapses after baking", "cause": "Moisture is off: a wet paste (too much egg or not dried on the heat), steam lost early by opening the oven, low heat, or under-baking so the shell does not set.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Dry the panade on the heat for 1-2 minutes with stirring, until a thin film forms on the pan bottom.", "Add the egg gradually until the paste is glossy and falls from the spoon in a V shape: do not add it all at once.", "Start hot (about 200-210°C) then lower the heat, and do not open the oven during the rise.", "Bake until deeply coloured, and at the end let steam out by cracking the oven door or piercing the shells."]}},{"id": "laminate-leak", "cat": "texture", "title": "الزبدة تتسرب من العجين الورقي (كرواسون، ميلفاي)", "cause": "حرارة الزبدة والعجين غير متقاربة: زبدة قاسية تتفتت وتخترق الطبقات، أو طرية تذوب وتختلط بالعجين، أو تخمّر زائد في مكان دافئ.", "fix": ["اجعل الزبدة والعجين في قوام متقارب (الزبدة طرية ومرنة وباردة نحو 14-16°م).", "اعمل في غرفة باردة وأرح العجين في الثلاجة بين اللفات.", "لا تفرط في التخمير؛ الحرارة فوق نحو 27°م قد تذيب الزبدة.", "استعمل زبدة للتصفيح (82% دهن وأكثر) فهي أقل ماءً."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Butter leaks out of laminated dough (croissant, puff)", "cause": "Butter and dough are at different consistencies: hard butter shatters and tears the layers, soft butter melts into the dough, or the proof was too warm.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Keep the butter and dough at similar consistency (butter pliable and cool, about 14-16°C).", "Work in a cool room and rest the dough in the fridge between turns.", "Do not over-proof: above about 27°C the butter can melt.", "Use a lamination butter (82% fat or higher) because it carries less water."]}},{"id": "macaron-fail", "cat": "texture", "title": "الماكارون أجوف، أو بلا قدم، أو متشقق", "cause": "درجة المكرونيج غير مضبوطة (خشنة أو مفرطة)، أو قشرة لم تتكوّن قبل الخبز، أو حرارة غير مناسبة، أو رطوبة الجو.", "fix": ["اخلط (macaronage) حتى يتدلى الخليط كشريط متصل يذوب في نحو 15-20 ثانية، لا أكثر.", "اترك الصواني حتى تتكوّن قشرة ناعمة لا تلتصق بالإصبع قبل الخبز (وقت أطول في الرطوبة).", "اخبز على 140-150°م وراقب فرنك؛ حرارة عالية تتشقق، ومنخفضة تُنتج أجواف.", "اطرق الصينية قبل الترك لإخراج الفقاعات.", "استعمل لوزاً ناعماً مجفّفاً وسكراً مطحوناً مغربلاً."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Macarons are hollow, footless or cracked", "cause": "The macaronage is off (under- or over-mixed), the shell did not form before baking, the temperature is wrong, or the air is humid.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Fold until the batter falls as a continuous ribbon that melts back in about 15-20 seconds, no more.", "Rest the trays until a smooth skin forms that does not stick to a finger (longer in humid weather).", "Bake at 140-150°C and watch your own oven: too hot cracks, too low makes hollows.", "Rap the tray on the counter before resting to release air bubbles.", "Use finely ground dry almond flour and sifted icing sugar."]}},{"id": "choc-bloom", "cat": "texture", "title": "الشوكولاتة عليها طبقة بيضاء أو رمادية (Bloom)", "cause": "نوعان: دهني (Fat bloom) من تمبرة خاطئة أو تقلب حراري فتصعد بلورات الدهن للسطح، وسكري (Sugar bloom) من رطوبة تذيب السكر على السطح ثم يتبلور.", "fix": ["Fat bloom: أعد التمبرة بالمنحنى الصحيح، وخزّن الشوكولاتة بين 16 و18°م بلا تقلب حراري.", "Sugar bloom: تجنّب الثلاجة غير المغلقة والتكثف؛ أخرج الشوكولاتة من البرودة داخل علبة مغلقة لتبلغ حرارة الغرفة قبل فتحها.", "خزّن بعيداً عن الضوء والروائح ورطوبة أعلى من نحو 55-60%.", "البلوم الدهني لا يضر الأمان، ويمكن إعادة إذابتها وتمبرتها."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Chocolate has a white or grey film (bloom)", "cause": "Two kinds: fat bloom from poor tempering or temperature swings, where fat crystals rise to the surface, and sugar bloom where moisture dissolves surface sugar that then recrystallises.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Fat bloom: re-temper with the right curve, and store the chocolate at 16-18°C without temperature swings.", "Sugar bloom: avoid an open fridge and condensation; let chocolate come to room temperature in a closed box before opening.", "Store away from light, odours and humidity above about 55-60%.", "Fat bloom is harmless and the chocolate can be melted and re-tempered."]}},{"id": "choc-seize", "cat": "texture", "title": "الشوكولاتة تتحول فجأة إلى كتلة خشنة (Seize)", "cause": "كمية قليلة من الماء أو البخار تلتصق بجزيئات السكر والكاكاو فتتكتل، فتتحول الشوكولاتة من سائل لامع إلى كتلة جامدة.", "fix": ["تجنب أي قطرة ماء: أدوات وأوعية جافة تماماً وابعد البخار عن الوعاء.", "إن تكتلت وكان الهدف غناش أو صوص: أضف سائلاً ساخناً (كريمة أو حليب) بكمية أكبر وحرّك بقوة حتى تلين.", "لن تعود صالحة للتمبرة؛ استعملها في غناش أو كيك.", "ذوّب على حرارة لطيفة ولا تتجاوز نحو 50°م للداكنة."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Chocolate suddenly turns into a grainy lump (seizing)", "cause": "A small amount of water or steam sticks to the sugar and cocoa particles and clumps them, turning glossy liquid into a stiff mass.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Avoid any drop of water: dry tools and bowls, and keep steam away from the bowl.", "If seized and you are making ganache or a sauce: add more hot liquid (cream or milk) and stir hard until it loosens.", "It will not temper again: use it in ganache or cake.", "Melt gently and do not exceed about 50°C for dark chocolate."]}},{"id": "temper-fail", "cat": "texture", "title": "التمبرة فاشلة: الشوكولاتة لا تتصلب أو لا تلمع", "cause": "بلورات الكاكاو بوتر المستقرة (النوع V) لم تتكوّن بسبب حرارة غير مضبوطة في إحدى المراحل (إذابة، تبريد، إعادة تسخين).", "fix": ["اتبع منحنى المورد؛ كمرجع عام: داكنة تذوب إلى 45-50°م ثم تبرّد إلى 27-28°م ثم ترفع إلى 31-32°م للعمل.", "بالحليب: 40-45°م ثم 26-27°م ثم 29-30°م. بيضاء: 40-45°م ثم 25-26°م ثم 28-29°م.", "استعمل ترمومتر دقيق، وحرّك باستمرار أثناء التبريد.", "اختبر بغمس سكين: تتصلب خلال 3-5 دقائق ولامعة بلا خطوط.", "أو استعمل طريقة التلقيح (seeding) بشوكولاتة ممزّجة جاهزة بنسبة 20-30%."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Tempering fails: chocolate does not set or lacks shine", "cause": "Stable cocoa butter crystals (form V) did not form because a temperature in one stage (melt, cool, rewarm) was off.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Follow your supplier's curve; as a general guide: dark melts to 45-50°C, cools to 27-28°C, then rises to 31-32°C for working.", "Milk: 40-45°C, then 26-27°C, then 29-30°C. White: 40-45°C, then 25-26°C, then 28-29°C.", "Use an accurate thermometer and stir continuously while cooling.", "Test by dipping a knife: it should set in 3-5 minutes, glossy and without streaks.", "Or use seeding with tempered chocolate at 20-30%."]}},{"id": "caramel-crystal", "cat": "texture", "title": "الكراميل أو شراب السكر يتبلور ويصير رملياً", "cause": "بلورة واحدة على جدار الوعاء أو تحريك قبل ذوبان السكر تكفي لتبدأ تبلور الكتلة كلها.", "fix": ["نظّف جدران الوعاء بفرشاة مبللة بالماء أثناء الغلي.", "أضف 10-25% من وزن السكر جلوكوزاً أو سكراً مقلوباً، أو قطرات ليمون، فهي تعيق التبلور.", "لا تحرّك السكر وهو يغلي بل أمِل الوعاء فقط.", "وعاء نظيف تماماً بلا بقايا."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Caramel or sugar syrup crystallises and turns sandy", "cause": "One crystal on the pan wall, or stirring before the sugar dissolves, is enough to start the whole mass crystallising.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Wash down the pan walls with a wet brush while boiling.", "Add 10-25% of the sugar weight as glucose or invert sugar, or a few drops of lemon, to hinder crystallisation.", "Do not stir boiling sugar: just swirl the pan.", "Use a spotless pan with no residue."]}},{"id": "caramel-texture", "cat": "texture", "title": "الكراميل أقسى أو أطرى مما أريد", "cause": "قوام الكراميل يتحدد بدرجة حرارة الطبخ النهائية (أي بنسبة الماء المتبقي)، ولو بفارق 2-3°م.", "fix": ["استعمل ترمومتر سكر مضبوطاً؛ كمرجع: كراميل طري (كرة طرية) نحو 112-116°م، كراميل قابل للمضغ نحو 118-122°م، قاسٍ نحو 130-135°م.", "عايِر الترمومتر في ماء مغلي (100°م) وعدّل الفارق، وتذكّر أن الارتفاع عن سطح البحر يخفض نقطة الغليان.", "أضف الكريمة الدافئة بحذر، فالتبخير يغيّر الوزن النهائي.", "برّد عينة على صحن بارد لفحص القوام قبل الانتهاء."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Caramel is harder or softer than I want", "cause": "Caramel texture is set by the final cooking temperature (the water left in it), often within 2-3°C.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Use a calibrated sugar thermometer; as a guide: soft ball (soft caramel) about 112-116°C, chewy caramel about 118-122°C, hard about 130-135°C.", "Calibrate the thermometer in boiling water (100°C) and correct the difference, and remember that altitude lowers the boiling point.", "Add warm cream carefully, as evaporation changes the final weight.", "Cool a spoonful on a cold plate to check the texture before finishing."]}},{"id": "ganache-firmness", "cat": "texture", "title": "الغناش أقسى أو أطرى من المطلوب", "cause": "القوام يتبع نسبة الشوكولاتة إلى الكريمة ونسبة الكاكاو: الشوكولاتة الداكنة تتماسك أكثر من الحليب والبيضاء لاحتوائها على مواد كاكاو أكثر.", "fix": ["كمرجع للداكنة (حوالي 55-70%): 1:1 للحشو والتغطية الطرية، و2:1 للتراتل المقطّع.", "للحليب: 2.5:1 أو أكثر، وللبيضاء: 3:1 أو أكثر لتتماسك.", "لتقوية قوام جاهز: أضف شوكولاتة ذائبة. لتليينه: أضف كريمة دافئة بالغاطس.", "اترك الغناش يتبلور في 20°م قبل الحكم على قوامه، فهو يزداد قساوة مع الراحة."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Ganache is firmer or softer than wanted", "cause": "The texture follows the chocolate-to-cream ratio and the type of chocolate: dark sets firmer than milk and white because of its higher cocoa solids.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["As a guide for dark (about 55-70%): 1:1 for a soft filling or glaze, 2:1 for cuttable truffles.", "For milk: 2.5:1 or more, for white: 3:1 or more, so it sets.", "To firm a finished batch: add melted chocolate. To soften it: add warm cream with a hand blender.", "Let the ganache crystallise at 20°C before judging, as it firms up with rest."]}},{"id": "cream-wont-whip", "cat": "texture", "title": "كريمة الخفق لا ترتفع ولا تتماسك", "cause": "دهن أقل من 30-35%، أو كريمة دافئة، أو وعاء دافئ، أو كريمة معالجة فائقة (UHT) قديمة أو بها مثبتات تعيق الخفق.", "fix": ["استعمل كريمة 35% دهن (أو 33-36%) باردة بحرارة 2-4°م.", "برّد الوعاء والمضرب في الثلاجة 15 دقيقة قبل البدء.", "لا تخفقها في غرفة حارة؛ ضع الوعاء على وعاء ثلج.", "أضف قليلاً من السكر الناعم أو مثبتاً (جيلاتين أو ماسكاربوني) لقوام أثبت."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Whipping cream will not whip or hold", "cause": "Fat below 30-35%, warm cream, a warm bowl, or old UHT cream with stabilisers that hinder whipping.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Use 35% fat cream (33-36%) at 2-4°C.", "Chill the bowl and whisk in the fridge for 15 minutes first.", "Do not whip in a hot room: set the bowl over ice.", "Add a little fine sugar or a stabiliser (gelatin or mascarpone) for a firmer hold."]}},{"id": "cream-to-butter", "cat": "texture", "title": "كريمة الخفق تحولت إلى حبيبات زبدة", "cause": "الخفق الزائد يكسر كريات الدهن فتتجمع وتفصل الماء (اللبن الخض).", "fix": ["أوقف الخفق قبل القمم الجامدة، وأكمل بالمضرب اليدوي في آخر لحظة.", "إن بدأت تتحبب: أضف 2-3 ملاعق كريمة سائلة باردة وحرّك بالملعقة.", "إن تحوّلت زبدة فعلاً: اغسلها واستعملها كزبدة.", "استعمل الكريمة باردة جداً ولا تسخّنها."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Whipped cream turns grainy and buttery", "cause": "Over-whipping breaks the fat globules so they clump and release the water (buttermilk).", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Stop before stiff peaks and finish with a hand whisk at the end.", "If it starts to turn grainy: fold in 2-3 tablespoons of cold liquid cream with a spoon.", "If it has become butter, rinse it and use it as butter.", "Keep the cream very cold and do not warm it."]}},{"id": "buttercream-split", "cat": "texture", "title": "كريمة الزبدة تتقطع أو تنفصل", "cause": "فرق حرارة بين الزبدة والميرنغ أو القاعدة: زبدة باردة فتتكتل، أو ساخنة فتسيل.", "fix": ["الزبدة بحرارة 18-20°م ومنخفضة اللين، والميرنغ بحرارة قريبة من الغرفة قبل إضافة الزبدة.", "إن بدت متكتلة: سخّن جدار الوعاء بمنشفة ساخنة ثم اخفق.", "إن بدت سائلة: برّد الوعاء 10 دقائق ثم اخفق.", "اخفق على سرعة متوسطة حتى تعود ملساء، فالتقطع غالباً قابل للإصلاح."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Buttercream curdles or splits", "cause": "A temperature gap between the butter and the meringue or base: cold butter makes it lumpy, warm butter makes it runny.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Butter at 18-20°C and pliable, and the meringue near room temperature before adding the butter.", "If it looks curdled: warm the bowl side with a hot towel and keep whisking.", "If it looks soupy: chill the bowl for 10 minutes then whisk.", "Whisk on medium speed until it turns smooth: splitting is usually fixable."]}},{"id": "meringue-weep", "cat": "texture", "title": "الميرنغ يبكي (قطرات شراب) أو يتعرق", "cause": "السكر لم يذب كلياً، أو رطوبة الجو، أو خبز ناقص فتعود الرطوبة وتخرج على السطح.", "fix": ["أضف السكر تدريجياً واخفق حتى لا تشعر بحبيبات بين الإصبعين.", "للميرنغ الفرنسي استعمل سكراً ناعماً جداً (كاستر) أو سخّن الخليط فوق حمام مائي (سويسري).", "جفّفه على 90-100°م ساعات، واتركه يبرد داخل الفرن المغلق.", "احفظه في وعاء محكم بعيداً عن الرطوبة."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Meringue weeps syrup beads or sweats", "cause": "The sugar did not fully dissolve, the air is humid, or it is under-baked so moisture returns to the surface.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Add the sugar gradually and whip until no grains are felt between the fingers.", "For French meringue use very fine (caster) sugar, or warm the mixture over a bain-marie (Swiss).", "Dry it at 90-100°C for hours and let it cool inside the closed oven.", "Store in an airtight container away from humidity."]}},{"id": "gelatin-fruit", "cat": "texture", "title": "الجيلاتين لا يتجلّط مع الأناناس أو الكيوي أو الباباي", "cause": "هذه الفواكه الطازجة تحتوي إنزيمات بروتياز (برومولين، أكتينيدين، باباين) تهدم بروتين الجيلاتين فلا يتجلط.", "fix": ["اغلِ هريس الفاكهة دقيقة على الأقل أو استعمل المعلّبة/المبسترة، فالحرارة تعطّل الإنزيم.", "استعمل مجلّطاً غير بروتيني: أجار أو بكتين أو كاراجينان.", "في الوصفات المثلجة استعمل هريساً مطبوخاً أو منتجاً مبسّراً."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Gelatin will not set with pineapple, kiwi or papaya", "cause": "These fresh fruits contain protease enzymes (bromelain, actinidin, papain) that break down gelatin protein, so it will not set.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Boil the fruit purée for at least one minute, or use canned or pasteurised purée: heat deactivates the enzyme.", "Use a non-protein gelling agent: agar, pectin or carrageenan.", "For frozen desserts use cooked purée or a pasteurised product."]}},{"id": "gelatin-rubbery", "cat": "texture", "title": "الجيلي أو البانا كوتا مطاطي وقاسٍ", "cause": "جرعة الجيلاتين أعلى من اللازم أو الوقت طويل في التبريد أو القوة (Bloom) أعلى من المتوقع.", "fix": ["قلّل الجيلاتين 10-20% وجرّب.", "تحقق من قوة الجيلاتين (Bloom): الأعلى يتطلب كمية أقل لنفس القوام.", "كمرجع تقريبي: بانا كوتا طرية نحو 0.8-1% من الوزن، وموس مستقر 1-1.5%.", "تأكد من إذابة الجيلاتين تماماً وتلطيفه قبل الدمج."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Jelly or panna cotta is rubbery and firm", "cause": "The gelatin dose is too high, setting time is long, or the Bloom strength is higher than expected.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Reduce the gelatin by 10-20% and test.", "Check the Bloom strength: a higher Bloom needs less gelatin for the same texture.", "As a rough guide: soft panna cotta about 0.8-1% of the weight, a stable mousse 1-1.5%.", "Make sure the gelatin is fully dissolved and tempered before mixing."]}},{"id": "gelatin-lumps", "cat": "texture", "title": "خيوط أو كتل جيلاتين داخل الموس", "cause": "الجيلاتين الذائب برّد أو أضيف إلى خليط بارد دفعة واحدة، فتجمد على شكل خيوط قبل أن ينتشر.", "fix": ["ألطّف الجيلاتين الذائب بإضافة ملعقتين من الخليط البارد، ثم أضفه تدريجياً مع التحريك.", "ذوّبه إلى نحو 40-50°م ولا تغلِه.", "حرّك بقوة أثناء الإضافة، ثم اخلط بالغاطس إن لزم."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Gelatin strings or lumps inside the mousse", "cause": "Melted gelatin cooled or was added to a cold mixture all at once, so it set into strands before dispersing.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Temper the melted gelatin by adding two spoonfuls of the cold mixture first, then add it gradually while stirring.", "Melt it to about 40-50°C and do not boil it.", "Stir hard while adding, then use a hand blender if needed."]}},{"id": "curd-scramble", "cat": "texture", "title": "كيرد الليمون (أو كريمة البيض) يتجبن أو تظهر فيه حبيبات بيض", "cause": "حرارة مباشرة عالية أو تحريك ناقص تجمّد البيض موضعياً قبل أن تتجانس الكريمة.", "fix": ["اطبخها على حمام مائي أو نار هادئة جداً مع التحريك المستمر.", "أصل بها إلى نحو 80-82°م لتثخن ثم صفّها فوراً.", "لا تترك الصفار مع السكر بدون خلط، فالسكر يحرق الصفار.", "إن تحبّبت قليلاً: صفّها واخلطها بالغاطس."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Lemon curd (or egg cream) scrambles or turns grainy", "cause": "High direct heat or too little stirring sets the egg locally before the cream becomes uniform.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Cook over a bain-marie or very gentle heat with constant stirring.", "Take it to about 80-82°C to thicken, then strain immediately.", "Never leave yolks sitting with sugar unmixed: the sugar cooks the yolk.", "If slightly grainy: strain and blend with a hand blender."]}},{"id": "baked-custard-fault", "cat": "texture", "title": "الكاسترد المخبوز (كريم بروليه/كراميل) به فقاعات أو ثقوب", "cause": "فرن ساخن جداً أو غياب الحمام المائي، فيغلي الخليط ويتجبّن ويكوّن فقاعات وثقوباً.", "fix": ["اخبز في حمام مائي دافئ على 140-160°م حتى يهتز المركز فقط (نحو 75-80°م).", "صفّ الخليط ثم أزل رغوته قبل الصبّ.", "غطّ الصينية بورق ألمنيوم للحفاظ على بخار لطيف.", "اترك الكاسترد يبرد في الفرن المطفأ مدة قصيرة."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Baked custard (crème brûlée/caramel) has bubbles or holes", "cause": "A very hot oven or no water bath makes it boil and curdle, forming bubbles and holes.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Bake in a warm water bath at 140-160°C until only the centre wobbles (about 75-80°C).", "Strain the mixture and skim the foam before pouring.", "Cover the tray with foil to keep a gentle steam.", "Let it cool in the switched-off oven for a short while."]}},{"id": "icecream-icy", "cat": "texture", "title": "الآيس كريم يحتوي بلورات ثلج وقوامه مثلّج", "cause": "ماء حر كثير ومواد صلبة قليلة، أو تجميد بطيء، أو تقلب حرارة التخزين فتكبر بلورات الثلج.", "fix": ["ارفع المواد الصلبة الكلية (نحو 36-40%) بإضافة حليب مجفف أو مواد صلبة أخرى.", "اضبط السكريات بإدخال دكستروز أو جلوكوز لخفض نقطة التجمد وتقليل الثلج.", "برّد القاعدة 4-12 ساعة على 4°م قبل المخض، وجمّد بسرعة (مخض قوي ودرجة حرارة منخفضة).", "أضف مثبتاً (صمغ الجوار أو الخروب أو ألياف) بجرعات صغيرة.", "خزّن على -18°م وأقل تقلباً."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Ice cream is icy with ice crystals", "cause": "A lot of free water and few solids, slow freezing, or storage temperature swings that grow the ice crystals.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Raise the total solids (about 36-40%) with milk powder or other solids.", "Balance the sugars with dextrose or glucose to lower the freezing point and reduce ice.", "Age the base 4-12 hours at 4°C before churning, and freeze fast (strong churn and low temperature).", "Add a stabiliser (guar, locust bean or fibre) in small doses.", "Store at -18°C with minimal fluctuation."]}},{"id": "icecream-sandy", "cat": "texture", "title": "الآيس كريم ذو قوام رملي", "cause": "بلورات اللاكتوز تتكون عند زيادة الحليب المجفف أو اللاكتوز مع تقلب حرارة التخزين.", "fix": ["قلّل الحليب المجفف قليلاً أو استبدل جزءاً بمواد صلبة خالية من اللاكتوز.", "خزّن بحرارة ثابتة ولا تكرر الإذابة والتجميد.", "استعمل مثبتاً وإنزيم لاكتاز إن أمكن."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Ice cream has a sandy texture", "cause": "Lactose crystals form when there is too much milk powder or lactose and storage temperature fluctuates.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Reduce the milk powder slightly or replace part with lactose-free solids.", "Store at a steady temperature and do not thaw and refreeze.", "Use a stabiliser, and lactase enzyme if possible."]}},{"id": "icecream-hard", "cat": "texture", "title": "الآيس كريم قاسٍ جداً ولا يُغرف", "cause": "قلة السكريات (خفض نقطة التجمد) أو هواء قليل (overrun منخفض) أو حرارة تقديم منخفضة.", "fix": ["ارفع نسبة السكر أو أضف دكستروز أو سكراً مقلوباً لخفض نقطة التجمد.", "زد الهواء بمخض أفضل ومثبت يحتفظ به.", "قدّمه بعد 10-15 دقيقة في -12 إلى -14°م بدل -18°م.", "للكحول: كمية قليلة جداً تلين دون أن تمنع التجمد."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Ice cream is rock hard and will not scoop", "cause": "Too little sugar (a higher freezing point), too little air (low overrun), or a very low serving temperature.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Raise the sugar or add dextrose or invert sugar to lower the freezing point.", "Add more air with better churning and a stabiliser that holds it.", "Serve after 10-15 minutes at -12 to -14°C instead of -18°C.", "With alcohol: a very small amount softens without preventing freezing."]}},{"id": "glaze-bubbles", "cat": "texture", "title": "الميرور جليز به فقاعات أو لا يلمع", "cause": "هواء دخل أثناء الخلط، أو حرارة الصبّ غير مناسبة، أو القاعدة ليست مجمّدة كفاية.", "fix": ["اخلط بالغاطس مغموراً بالكامل ومائلاً لتقليل الفقاعات، ثم صفّه وأزل الرغوة.", "صبّه عند نحو 30-35°م (حسب الوصفة) على قاعدة مجمدة تماماً (-18°م).", "اترك الجليز يرتاح 12 ساعة في الثلاجة قبل الاستعمال.", "استعمل قاعدة مصقولة ملساء."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Mirror glaze has bubbles or lacks shine", "cause": "Air was introduced while blending, the pouring temperature is off, or the base is not frozen enough.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Blend with the stick blender fully submerged and tilted to limit bubbles, then strain and skim the foam.", "Pour at about 30-35°C (per recipe) onto a fully frozen base (-18°C).", "Rest the glaze 12 hours in the fridge before using.", "Use a smooth, polished base."]}},{"id": "cake-wet-bottom", "cat": "cake", "title": "طبقة لزجة رطبة في قاع الكيكة", "cause": "ترسب البيض والسكر في القاع لعدم الدمج الجيد، أو خبز ناقص، أو تبريد الكيكة في قالب مغلق فتتكثف الرطوبة.", "fix": ["اخلط العجينة حتى تتجانس تماماً، وخاصة أثناء إضافة السوائل.", "تأكد من النضج الكامل، وزد الوقت 5-10 دقائق إن بقيت رطبة.", "أخرج الكيكة من القالب بعد 10-15 دقيقة وبرّدها على شبك.", "ضع الكيكة على الرف الأوسط، فالرف السفلي يسخّن القاع."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "A wet, gummy layer at the bottom of the cake", "cause": "Egg and sugar settled to the bottom from poor mixing, under-baking, or cooling the cake in a closed pan so moisture condenses.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Mix the batter until fully uniform, especially while adding liquids.", "Make sure it is fully baked and add 5-10 minutes if it stays wet.", "Unmould after 10-15 minutes and cool on a rack.", "Bake on the middle rack: the bottom rack overheats the base."]}},{"id": "fondant-crack", "cat": "texture", "title": "الفوندان (عجينة السكر) يتشقق أو يتعرق", "cause": "جفاف السطح يعطي تشققات، ورطوبة الغلاف مع التبريد تعطي تعرقاً وصمغاً.", "fix": ["اعجنه بقليل من الدهن النباتي (shortening) ليلين بدل الماء.", "غطّه بالبلاستيك دائماً أثناء العمل، ولا تضعه في الثلاجة مكشوفاً.", "تجنّب إخراج كيك مبرّد مباشرة؛ اتركه يتأقلم في علبة مغلقة قبل التغطية.", "الكيك المبرّد المغطى بالفوندان يحتاج علبة وجفافاً بعد الإخراج."], "note": "مجمّعة من أساسيات علم الحلويات. اضبط الأرقام على فرنك ومكوناتك وراجعها بتجربتك.", "en": {"title": "Fondant (sugar paste) cracks or sweats", "cause": "A dry surface causes cracks, while condensation from chilling causes sweating and stickiness.", "note": "Compiled from pastry-science fundamentals. Adjust the figures to your own oven and ingredients and check them with your own trials.", "fix": ["Knead in a little vegetable shortening to soften it instead of water.", "Keep it covered with plastic while working, and never put it in the fridge uncovered.", "Do not take a chilled cake out and cover it at once: let it acclimatise in a closed box first.", "A chilled fondant cake needs a box and dry air after it leaves the fridge."]}}],"LIB":[{"id":"emul","title":"الاستحلاب","intro":"الهدف مستحلب مستقر وقوام كريمي. اختر المستحلب بعد تحديد نوع المستحلب والمكونات.","items":[{"name":"الليسيثين (Lecithin)","body":["يناسب مستحلب ماء في زيت.","يرفع اللزوجة.","يختلف عن إسترات السكروز في الأوساط عالية الكحول."]},{"name":"المونو ودايجليسريد","body":["يناسب مستحلب ماء في زيت، وهو والليسيثين أول خيارين عند هذا النوع."]},{"name":"بروتينات الحليب","body":["الحليب الكامل فيه نحو 3 إلى 3.5% بروتين، والكريمة 35% دسم فيها من 2 إلى 3%.","نحو 80% كازين و20% بروتينات شرش.","الكازين يتجمع في ميسيلات، وهو مستحلب ممتاز.","تحقق من حالة الكازين إن عُولج حرارياً."]},{"name":"إسترات السكروز","body":["مستحلب صناعي ناتج عن تفاعل السكروز مع الأحماض الدهنية، وهو الأكثر استخداماً في زيت في ماء.","HLB يتراوح من 6 إلى 16 حسب المنتج، فاطلب الورقة الفنية.","الجرعة 0.5% إلى 1% للمستحلبات، و0.1% إلى 0.3% للأهواء.","تعمل في المحاليل عالية الكحول."]},{"name":"ألياف الحمضيات","body":["تحبس ماءً يصل إلى 10 أضعاف وزنها، وتبقي المخبوزات رطبة مدة أطول.","تتحمل التجميد، وطعمها محايد تقريباً.","تعمل كمستحلب بحرارة الغرفة لزيت في ماء، ولا تناسب ماء في زيت.","الجرعة في المستحلبات من 0.5% إلى 1.5%."]}],"en":{"title":"Emulsification","intro":"The goal is a stable emulsion and a creamy texture. Choose the emulsifier after fixing the emulsion type and the ingredients.","items":[["Lecithin",["Suits water-in-oil emulsions.","Raises viscosity.","Differs from sucrose esters in high-alcohol media."]],["Mono- and diglycerides",["Suit water-in-oil emulsions; with lecithin they are the first two choices for this type."]],["Milk proteins",["Whole milk has about 3 to 3.5% protein, and 35% cream has 2 to 3%.","About 80% casein and 20% whey proteins.","Casein gathers into micelles and is an excellent emulsifier.","Check the state of the casein if it was heat-treated."]],["Sucrose esters",["A synthetic emulsifier from sucrose reacting with fatty acids, the most used in oil-in-water.","HLB ranges from 6 to 16 depending on the product, so ask for the technical sheet.","Dose 0.5% to 1% for emulsions, and 0.1% to 0.3% for airs.","They work in high-alcohol solutions."]],["Citrus fiber",["Binds up to 10 times its weight in water and keeps baked goods moist longer.","Tolerates freezing and has an almost neutral taste.","Acts as an oil-in-water emulsifier at room temperature, and does not suit water-in-oil.","Dose in emulsions: 0.5% to 1.5%."]]]}},{"id":"air","title":"التهوية","intro":"اختر عامل الرغوة حسب القوام المطلوب (موس، إسفنج، مارشميلو)، ثم نباتي أم لا، ثم الطعم.","items":[{"name":"بروتينات البيض","body":["بياض البيض أو الأوفالبيومين المجفف: رغوة وتجلتن معاً في الفرن.","مناسب للإسفنج لأنه يعطي بنية ثابتة."]},{"name":"البروتينات النباتية وأكوافابا","body":["بروتين الصويا أو البطاطس أو أكوافابا لإدخال الهواء.","تحتاج مثخّناً (زانثان أو خروب أو تارا) لتثبيت الميرنغ، ونشاً للتجلتن في الفرن.","درجة التكرير تؤثر في الطعم والرائحة."]},{"name":"إسترات السكروز للأهواء","body":["من 0.1% إلى 0.3% لهواء خفيف سريع الزوال.","أضف عامل تجيل أو مثبتاً لهواء أثبت."]}],"en":{"title":"Aeration","intro":"Choose the foaming agent by the texture you want (mousse, sponge, marshmallow), then vegan or not, then flavor.","items":[["Egg proteins",["Egg white or dried ovalbumin: foaming and gelling together in the oven.","Suits sponge because it gives a stable structure."]],["Plant proteins and aquafaba",["Soy, potato protein or aquafaba to bring in air.","They need a thickener (xanthan, locust bean or tara) to stabilize the meringue, and starch to gel in the oven.","The refining level affects taste and smell."]],["Sucrose esters for airs",["From 0.1% to 0.3% for a light, quickly fading air.","Add a gelling agent or stabilizer for a more stable air."]]]}},{"id":"thick","title":"التكثيف","intro":"اللزوجة تخص السوائل. الكثافة وزن لكل حجم، واللزوجة مقاومة الانسياب.","items":[{"name":"النشا","body":["نشا حبوب (ذرة) أو جذور ودرنات (بطاطس، تابيوكا)، وطبيعي أو معدّل.","أهم استخداماته الكاسترد: لزوجته من تخثّر البروتين ومن التثخين بالنشا.","النوع يغيّر النعومة واللمعان."]},{"name":"الفركتانات (الإينولين)","body":["ألياف ذائبة تحبس ماءً أكثر من السكر.","تسمح بتقليل السكر دون فقد المادة الجافة والثبات.","تعطي قواماً وتساعد في استبدال الدهون."]},{"name":"صمغ الزانثان","body":["مثخّن قوي جداً يُستخدم بتراكيز منخفضة.","ينتج بتخمير بكتيريا Xanthomonas campestris، ورقمه E-415.","لم تُحدَّد له جرعة يومية مقبولة (ADI)."]}],"en":{"title":"Thickening","intro":"Viscosity belongs to liquids. Density is weight per volume, and viscosity is resistance to flow.","items":[["Starch",["Cereal starch (corn) or root and tuber starch (potato, tapioca), native or modified.","Its main use is custard: the viscosity comes from protein coagulation and from starch thickening.","The type changes smoothness and shine."]],["Fructans (inulin)",["Soluble fibers that bind more water than sugar.","They let you cut sugar without losing dry extract and stability.","They give texture and help replace fat."]],["Xanthan gum",["A very strong thickener used at low concentrations.","Made by fermentation with Xanthomonas campestris bacteria, number E-415.","No acceptable daily intake (ADI) has been set for it."]]]}}],"AL":{"gluten":"غلوتين","egg":"بيض","milk":"حليب","nuts":"مكسرات","soy":"صويا","sesame":"سمسم","peanut":"فول سوداني"},"ICATS":[{"id":"all","label":"الكل","en":"All"},{"id":"dairy","label":"ألبان وقشدة","en":"Dairy and cream"},{"id":"fats","label":"زيوت ودهون","en":"Oils and fats"},{"id":"sugars","label":"سكريات","en":"Sugars"},{"id":"flour","label":"دقيق ونشا","en":"Flour and starch"},{"id":"choc","label":"شوكولاتة وكاكاو","en":"Chocolate and cocoa"},{"id":"eggs","label":"بيض","en":"Eggs"},{"id":"add","label":"إضافات وسوائل","en":"Additives and liquids"},{"id":"nuts","label":"مكسرات وبذور","en":"Nuts and seeds"},{"id":"fruit","label":"فواكه وهرائس","en":"Fruit and purées"},{"id":"hydro","label":"مثخنات ومجلّطات","en":"Thickeners and gelling agents"},{"id":"emul","label":"مستحلبات وبروتينات","en":"Emulsifiers and proteins"},{"id":"spice","label":"نكهات وتوابل وألوان","en":"Flavors, spices and colors"},{"id":"alcohol","label":"كحوليات ونكهات سائلة","en":"Alcohol and liquid flavors"}],"SRC":{"label":"التركيب من ملصق المنتج أو قاعدة بيانات المنتج.","brand":"العلامة سعودية مؤكدة، والتركيب نموذجي لهذه الفئة وليس من ملصق هذا المنتج.","est":"التركيب تقريبي. راجع ملصق منتجك أو ورقته الفنية.","user":"أضفته أنت."},"ING_DEFAULTS":[{"brand":"","supplier":"","cat":"flour","src":"est","note":"","id":"flour","name":"دقيق","water":12,"fat":1,"protein":10.5,"sugar":0.5,"price":"","allergens":["gluten"],"en":"Flour","fn":"هيكل الكيك والعجين من النشا والغلوتين.","fnEn":"Structure from starch and gluten."},{"brand":"","supplier":"","cat":"sugars","src":"est","note":"","id":"sugar","name":"سكر","water":0,"fat":0,"protein":0,"sugar":100,"price":"","allergens":[],"en":"Sugar","fn":"حلاوة وطراوة وتحمير واحتفاظ بالرطوبة.","fnEn":"Sweetness, tenderness, browning and moisture retention."},{"brand":"","supp     w+=g*num(i.water)/100;f+=g*num(i.fat)/100;p+=g*num(i.protein)/100;s+=g*num(i.sugar)/100;
    const price=num(r.price)||num(i.price)||num((MS[r.ing]||{}).price);if(price>0)cost+=g*price/1000;else missing++;(i.allergens||[]).forEach(a=>al.add(a))});

}

function sciAn(p,r){let tot=0,mm=0,W=0,pod=0,pac=0,Es=0,alc=0,sucE=0,lacE=0;
